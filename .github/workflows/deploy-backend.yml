name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag gcr.io/esicodehub/esicodehub-backend \
            --dockerfile backend/Dockerfile.prod \
            --project=esicodehub \
            ./backend

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy esicodehub-backend \
            --image gcr.io/esicodehub/esicodehub-backend \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 80 \
            --timeout 300 \
            --set-env-vars DJANGO_SETTINGS_MODULE=config.settings.production \
            --set-env-vars POSTGRES_DB=esicodehub \
            --set-env-vars POSTGRES_USER=esicodehub_user \
            --set-secrets "SECRET_KEY=SECRET_KEY:latest" \
            --set-secrets "POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest" \
            --set-secrets "EMAIL_HOST_USER=EMAIL_HOST_USER:latest" \
            --set-secrets "EMAIL_APP_PASSWORD=EMAIL_APP_PASSWORD:latest" \
            --set-secrets "GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest" \
            --set-secrets "GOOGLE_CLOUD_PROJECT=GOOGLE_CLOUD_PROJECT:latest" \
            --set-secrets "FRONTEND_URL=FRONTEND_URL:latest" \
            --set-secrets "REDIS_URL=REDIS_URL:latest" \
            --add-cloudsql-instances esicodehub:europe-west1:esicodehub-db \
            --project=esicodehub

      - name: Deploy Celery worker to Cloud Run
        run: |
          gcloud run deploy esicodehub-celery \
            --image gcr.io/esicodehub/esicodehub-backend \
            --platform managed \
            --region europe-west1 \
            --no-allow-unauthenticated \
            --min-instances 1 \
            --max-instances 2 \
            --memory 2Gi \
            --cpu 2 \
            --concurrency 1 \
            --timeout 3600 \
            --set-env-vars DJANGO_SETTINGS_MODULE=config.settings.production \
            --set-env-vars POSTGRES_DB=esicodehub \
            --set-env-vars POSTGRES_USER=esicodehub_user \
            --set-secrets "SECRET_KEY=SECRET_KEY:latest" \
            --set-secrets "POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest" \
            --set-secrets "GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest" \
            --set-secrets "GOOGLE_CLOUD_PROJECT=GOOGLE_CLOUD_PROJECT:latest" \
            --set-secrets "REDIS_URL=REDIS_URL:latest" \
            --add-cloudsql-instances esicodehub:europe-west1:esicodehub-db \
            --command "celery" \
            --args "-A,config,worker,--loglevel=info,--concurrency=2" \
            --project=esicodehub
