  docker-build:
    name: Docker Build (Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t frontend-test ./frontend -f frontend/Dockerfile
